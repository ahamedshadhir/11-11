<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>Login | 11-11</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="/static/css/brand.css">
<link rel="stylesheet" href="/static/css/amazon.css">
<style>
.auth-wrap{min-height:62vh;display:grid;place-items:center;padding:48px 16px;background:#f6efe4}
.auth-card{width:min(440px,100%);background:#fff;border:1px solid #eadfce;border-radius:16px;padding:28px}
.auth-card img.auth-logo{height:72px;width:auto;display:block;margin:0 auto 12px}
.auth-card h1{text-align:center;color:#420e15;font-family:Georgia,serif;margin:0 0 8px}
.auth-card .muted{text-align:center;color:#7a5a3a}
.auth-card label{display:block;margin:12px 0 6px;color:#420e15;font-weight:600}
.auth-card input{width:100%;padding:12px;border:1px solid #d9c7a8;border-radius:10px}
.auth-card button{margin-top:16px;width:100%;padding:12px;border:0;border-radius:10px;background:#420e15;color:#fff;font-weight:700}
.mini-head{background:#fff;border-bottom:1px solid #eee;padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.mini-head img{height:76px}
.mini-head a{color:#420e15;font-weight:700;text-decoration:none}
.mini-bar{background:#420e15;color:#fff;padding:8px 24px;font-size:13px}
.mini-foot{background:#1a0c0f;color:#f6f3ee;padding:28px 24px 16px}
.mini-foot img{height:64px;background:#fff;border-radius:8px;padding:6px}
</style>
</head>
<body>
<header class="mini-head">
  <a href="/"><img src="/static/img/logo.svg?v=3" alt="11:11 eleven-eleven"></a>
  <a href="/">Back to store</a>
</header>
<div class="mini-bar">11-11 — electronics, fashion and home in Qatar</div>
<main class="auth-wrap">
  <div class="auth-card">
    <img class="auth-logo" src="/static/img/logo.svg?v=3" alt="11:11">
    <h1>Sign in</h1>
    <p class="muted">Same account you use on the 11-11 store.</p>
    <form method="post" action="/login">
      <label>Email</label>
      <input type="email" name="email" value="demo@1111.local" required>
      <label>Password</label>
      <input type="password" name="password" value="demo123" required>
      <button type="submit">Sign in</button>
    </form>
    <p class="muted" style="margin-top:16px"><a href="/user/signup" style="color:#be923b">Create account</a></p>
  </div>
</main>
<footer class="mini-foot">
  <img src="/static/img/logo-light.svg?v=3" alt="11-11">
  <p>&copy; 11-11 Qatar</p>
</footer>
</body>
</html>
