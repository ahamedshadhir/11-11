{% extends "base.html" %}
{% block title %}Products | Admin{% endblock %}
{% block content %}
{% from "_admin_nav.html" import admin_nav %}
<div class="adm-wrap">
  {{ admin_nav('products') }}
  <div class="adm-main">
    <h1>Product management</h1>
    <form method="post" class="adm-card grid-form">
      <h3>Add product</h3>
      <input name="name" placeholder="Name" required>
      <input name="price" type="number" step="0.01" placeholder="Price QAR" required>
      <input name="compare_at" type="number" step="0.01" placeholder="Compare at">
      <input name="stock" type="number" placeholder="Stock" value="20">
      <input name="image" placeholder="Image URL">
      <select name="category_id"><option value="">Category</option>{% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select>
      <label><input type="checkbox" name="is_featured"> Featured</label>
      <label><input type="checkbox" name="is_flash"> Flash</label>
      <label><input type="checkbox" name="is_bestseller"> Bestseller</label>
      <textarea name="description" placeholder="Description"></textarea>
      <button class="common-btn" type="submit">Add product</button>
    </form>
    <table class="cart-table">
      <thead><tr><th>Name</th><th>Price</th><th>Stock</th><th>Flags</th><th></th></tr></thead>
      <tbody>
      {% for p in products %}
        <tr>
          <td><form method="post" action="{{ url_for('admin_product_save', pid=p.id) }}" class="row-form"><input name="name" value="{{ p.name }}"><input name="image" value="{{ p.image or '' }}" placeholder="Image URL"></td>
          <td><input name="price" type="number" step="0.01" value="{{ p.price }}"></td>
          <td><input name="stock" type="number" value="{{ p.stock }}"></td>
          <td><label><input type="checkbox" name="is_featured" {% if p.is_featured %}checked{% endif %}> Feat</label> <label><input type="checkbox" name="is_flash" {% if p.is_flash %}checked{% endif %}> Flash</label> <label><input type="checkbox" name="is_bestseller" {% if p.is_bestseller %}checked{% endif %}> Best</label></td>
          <td><button class="common-btn" type="submit">Save</button><button class="common-bd-btn" name="delete" value="1" type="submit">Delete</button></form></td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
