{% extends "admin_base.html" %}
{% block title %}Products | 11-11 Admin{% endblock %}
{% block admin %}
<header class="adm-head">
  <div>
    <h1>Products</h1>
    <p>{{ products|length }} items in the catalog.</p>
  </div>
  <form method="get" action="/__reseed"><button class="adm-primary" type="submit">Reload catalog</button></form>
</header>

<section class="adm-panel">
  <h2>Add product</h2>
  <form method="post" class="adm-fields">
    <label>Name<input name="name" required></label>
    <label>Price (QAR)<input name="price" type="number" step="0.01" required></label>
    <label>Stock<input name="stock" type="number" value="20"></label>
    <label>Image URL<input name="image"></label>
    <label>Category
      <select name="category_id">
        <option value="">None</option>
        {% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
      </select>
    </label>
  </form>
  <form method="post" style="margin-top:12px"><button class="adm-primary" type="submit">Add product</button></form>
</section>

<section class="adm-panel">
  <h2>Catalog</h2>
  <div class="adm-pick" style="max-height:none">
    <table>
      <thead><tr><th></th><th>Name</th><th>Price</th><th>Stock</th><th></th></tr></thead>
      <tbody>
      {% for p in products %}
      <tr>
        <td><img src="{{ p.image }}" alt="" width="40" height="40" style="object-fit:contain;background:#fff;border:1px solid #eadfce;border-radius:6px"></td>
        <td>
          <form method="post" action="/admin/products/{{ p.id }}" class="adm-actions" style="align-items:center">
            <input name="name" value="{{ p.name }}" style="min-width:180px;border:1px solid #eadfce;border-radius:6px;padding:6px 8px">
        </td>
        <td><input name="price" type="number" step="0.01" value="{{ p.price }}" style="width:90px;border:1px solid #eadfce;border-radius:6px;padding:6px 8px"></td>
        <td><input name="stock" type="number" value="{{ p.stock }}" style="width:70px;border:1px solid #eadfce;border-radius:6px;padding:6px 8px"></td>
        <td>
            <button type="submit">Save</button>
            <button class="ghost" name="delete" value="1">Delete</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="5">Catalog is empty. Click Reload catalog.</td></tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</section>
{% endblock %}
