<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}11-11 Admin{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}" />
</head>
<body class="adm-body">
  <aside class="adm-side">
    <a class="adm-brand" href="/admin">
      <strong>11:11</strong>
      <em>eleven-eleven</em>
    </a>
    <nav>
      <a href="/admin">Dashboard</a>
      <a href="/admin/sales">Flash sales</a>
      <a href="/admin/products">Products</a>
      <a href="/admin/users">Users</a>
      <a href="/admin/banners">Banners</a>
      <a href="/admin/settings">Settings</a>
    </nav>
    <div class="adm-side-foot">
      <a href="/" target="_blank" rel="noopener">Open store</a>
      <a href="{{ url_for('logout') }}">Log out</a>
    </div>
  </aside>
  <main class="adm-main">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}{% for cat, msg in messages %}<p class="adm-flash">{{ msg }}</p>{% endfor %}{% endif %}
    {% endwith %}
    {% block admin %}{% endblock %}
  </main>
</body>
</html>
