{% extends "admin_base.html" %}
{% block title %}Banners | 11-11 Admin{% endblock %}
{% block admin %}
<h1>Banners</h1>
<form method="post" class="adm-card grid-form">
  <select name="kind"><option value="banner">Hero</option><option value="promo">Promo</option></select>
  <input name="title" placeholder="Title" required>
  <input name="image" placeholder="Image URL" required>
  <input name="link" value="/shop">
  <button class="common-btn" type="submit">Add</button>
</form>
<table class="cart-table">
  <thead><tr><th>Title</th><th>Image</th><th>Link</th><th></th></tr></thead>
  <tbody>
  {% for b in banners %}
  <tr><td><form method="post" action="{{ url_for('admin_banner_save', kind='banner', bid=b.id) }}" class="row-form"><input name="title" value="{{ b.title }}"></td><td><input name="image" value="{{ b.image }}"></td><td><input name="link" value="{{ b.link }}"></td><td><button class="common-btn">Save</button><button class="common-bd-btn" name="delete" value="1">Delete</button></form></td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
