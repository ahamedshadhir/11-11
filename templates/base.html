<!DOCTYPE html>
<html lang="{{ lang }}" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light only" />
  <meta name="supported-color-schemes" content="light" />
  <meta name="theme-color" content="#f6f3ee" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>{% block title %}11-11{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml" />
  <style>
    :root{color-scheme:light only}
    html,body,main{background:#f6f3ee!important;color:#420e15!important}
    body{margin:0;display:block!important;min-height:100vh}
    main{display:block!important;visibility:visible!important;opacity:1!important;position:relative;z-index:2}
    .mega,.overlay,.drawer{display:none!important}
    .catbar{display:flex;gap:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;background:#420e15;padding:10px 16px}
    .catbar a{color:#fff;text-decoration:none;white-space:nowrap}
    .header-card{background:#fff!important;position:relative;z-index:20;border-bottom:1px solid #eadfce}
    .header-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px}
    .header-mid,.search-form{display:flex!important;flex:1;min-width:140px}
    a{color:#420e15}
    @media (prefers-color-scheme: dark){
      html,body,main{background:#f6f3ee!important;color:#420e15!important}
    }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/brand.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ui.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}" />
</head>
<body>
  <p style="margin:0;padding:8px 16px;background:#be923b;color:#420e15;font-weight:700">11-11 Qatar</p>
  {% if live_sale and request.endpoint not in ['login','register'] %}
  <a class="sale-banner" href="{{ url_for('shop', flash=1) }}">LIVE {{ live_sale.title }} — {{ live_sale.discount|int }}% off</a>
  {% endif %}
  <header class="header-card">
    <div class="header-row">
      <a class="header-logo" href="{{ url_for('index') }}"><span class="logo-mark">11:11</span></a>
      <form class="search-form" action="{{ url_for('shop') }}" method="get">
        <input name="q" placeholder="Search" value="{{ request.args.get('q','') }}" style="flex:1;padding:8px">
        <button type="submit">Go</button>
      </form>
      <a href="{{ url_for('cart') }}">Cart</a>
      <a href="{{ url_for('login') }}">Login</a>
    </div>
    <nav class="catbar">{% for cat in all_categories %}<a href="{{ url_for('shop', category=cat.id) }}">{{ cat.name }}</a>{% endfor %}</nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  {% include "_footer.html" %}
</body>
</html>
