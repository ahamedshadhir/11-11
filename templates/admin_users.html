{% extends "admin_base.html" %}
{% block title %}Users | 11-11 Admin{% endblock %}
{% block admin %}
<h1>Users & roles</h1>
<p class="muted">customer · vendor · staff · admin</p>
<table class="cart-table">
  <thead><tr><th>Name</th><th>Email</th><th>Role</th><th></th></tr></thead>
  <tbody>
  {% for u in users %}
  <tr>
    <td><form method="post" action="{{ url_for('admin_user_save', uid=u.id) }}" class="row-form"><input name="name" value="{{ u.name }}"></td>
    <td>{{ u.email }}</td>
    <td>
      <select name="role">
        {% set r = u.role if u.role else ('admin' if u.is_admin else ('vendor' if u.is_vendor else 'customer')) %}
        {% for opt in ['customer','vendor','staff','admin'] %}
        <option value="{{ opt }}" {% if r==opt %}selected{% endif %}>{{ opt }}</option>
        {% endfor %}
      </select>
    </td>
    <td><button class="common-btn">Save</button></form></td>
  </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
