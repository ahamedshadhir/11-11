{% if current_user.is_authenticated %}
<div class="member-bar">
  <div class="container">
    <div>{{ t('welcome') }}, <strong>{{ current_user.name.split()[0] if current_user.name else '' }}</strong></div>
    <div>
      <a href="{{ url_for('account') }}">{{ t('profile') }}</a>
      <a href="{{ url_for('my_orders') }}">{{ t('orders') }}</a>
      <a href="{{ url_for('wishlist') }}">{{ t('wishlist') }}</a>
    </div>
  </div>
</div>
{% endif %}
