{% extends "m_base.html" %}
{% block title %}Shop | 11-11{% endblock %}
{% block content %}
<section class="hero"><h1>{{ heading or t('shop_now') }}</h1></section>
<section class="grid">
  {% for p in products %}
  <article class="card">
    <a href="/m/product/{{ p.id }}/{{ p.slug }}"><img src="{{ p.image }}" alt="{{ p.name }}"></a>
    <h3>{{ p.name }}</h3>
    <div class="price">{{ p.price|qar }}</div>
    <p style="padding:0 10px 12px"><button class="common-btn" type="button" data-add="{{ p.id }}">{{ t('add_to_cart') }}</button></p>
  </article>
  {% else %}<p class="pad">No products.</p>{% endfor %}
</section>
{% endblock %}
