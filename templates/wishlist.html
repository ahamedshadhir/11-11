{% extends "base.html" %}
{% from "_macros.html" import product_card %}
{% block title %}Wishlist | 11-11{% endblock %}
{% block content %}
<div class="container page-hero"><h2>Wishlist</h2></div>
<div class="container" style="padding-bottom:48px">
  {% if products %}
  <div class="product-grid">
    {% for p in products %}
      <div>
        {{ product_card(p) }}
        <p class="text-center"><a href="{{ url_for('wishlist_remove', pid=p.id) }}">Remove</a></p>
      </div>
    {% endfor %}
  </div>
  {% else %}
    <div class="panel text-center"><p>No saved items yet.</p></div>
  {% endif %}
</div>
{% endblock %}
