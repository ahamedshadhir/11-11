{% extends "base.html" %}
{% block title %}Login | 11-11{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-card">
    <span class="logo-mark">11<span>:</span>11</span>
    <h2>Sign in</h2>
    <a class="oauth-btn google" href="/auth/google">Continue with Google</a>
    <a class="oauth-btn apple" href="/auth/apple">Continue with Apple</a>
    <p class="muted" style="text-align:center;margin:14px 0">or use email</p>
    <form method="post" action="/login">
      <label>Email</label>
      <input type="email" name="email" required>
      <label>Password</label>
      <input type="password" name="password" required>
      <button class="common-btn w-100" type="submit">Sign in</button>
    </form>
    <p class="muted"><a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</section>
{% endblock %}
