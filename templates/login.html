{% extends "base.html" %}
{% block title %}Login | 11-11{% endblock %}
{% block content %}
<div class="auth-card">
  <h2>Login</h2>
  <p class="muted">Demo customer: demo@1111.local / demo123<br>Admin: admin@1111.local / admin123</p>
  <form method="post" action="/signin">
    <label>Email</label>
    <input type="email" name="email" required>
    <label>Password</label>
    <input type="password" name="password" required>
    <button class="common-btn w-100 mt-3" type="submit">Sign in</button>
  </form>
  <p class="mt-3">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
