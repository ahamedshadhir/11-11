{% extends "base.html" %}
{% block title %}{{ t('login') }} | 11-11{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-card">
    <span class="logo-mark">11<span>:</span>11</span>
    <h2>{{ t('sign_in') }}</h2>
    <form method="post" action="/login">
      <label>{% if lang=='ar' %}البريد{% else %}Email{% endif %}</label>
      <input type="email" name="email" required>
      <label>{% if lang=='ar' %}كلمة المرور{% else %}Password{% endif %}</label>
      <input type="password" name="password" required>
      <button class="common-btn w-100" type="submit">{{ t('sign_in') }}</button>
    </form>
    <p class="muted"><a href="{{ url_for('register') }}">{{ t('create') }}</a></p>
  </div>
</section>
{% endblock %}
