{% extends "base.html" %}
{% block title %}Categories | 11-11{% endblock %}
{% block content %}
<div class="container page-hero"><h2>All categories</h2></div>
<div class="container" style="padding-bottom:48px">
  <div class="category-list" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr))">
    {% for c in all_categories %}
    <a class="category-card" href="{{ url_for('shop', category=c.id) }}">
      <div class="category-img"><img src="{{ c.image }}" alt="{{ c.name }}"></div>
      <h4 class="category-name">{{ c.name }}</h4>
    </a>
    {% endfor %}
  </div>
</div>
{% endblock %}
