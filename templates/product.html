{% extends "base.html" %}
{% from "_price.html" import deal_price with context %}
{% block title %}{{ product.name }} | 11-11{% endblock %}
{% block content %}
<div class="container page-hero">
  <div class="breadcrumbs"><a href="{{ url_for('index') }}">Home</a> / {{ product.name }}</div>
</div>
<div class="container" style="padding-bottom:48px">
  <div class="product-hero">
    <img src="{{ product.image }}" alt="{{ product.name }}">
    <div>
      <h1>{{ product.name }}</h1>
      {{ deal_price(product) }}
      <p>{{ product.description }}</p>
      <button class="common-btn" type="button" data-add="{{ product.id }}">Add to cart</button>
    </div>
  </div>
</div>
{% endblock %}
