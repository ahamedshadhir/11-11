{% extends "base.html" %}
{% block title %}Become a seller | 11-11{% endblock %}
{% block content %}
<div class="auth-card">
  <h2>Become a seller</h2>
  <form method="post">
    <label>Store name</label><input type="text" name="store" required>
    <label>Contact email</label><input type="email" name="email" required>
    <label>Category you sell</label>
    <select name="category">
      {% for c in all_categories %}<option>{{ c.name }}</option>{% endfor %}
    </select>
    <label>About your catalog</label>
    <textarea name="about" rows="4"></textarea>
    <button class="common-btn w-100 mt-3" type="submit">Apply</button>
  </form>
</div>
{% endblock %}
