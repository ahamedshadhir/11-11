{% extends "base.html" %}
{% block title %}Contact | 11-11{% endblock %}
{% block content %}
<div class="auth-card">
  <h2>Contact us</h2>
  <p class="muted">Doha, Qatar · support@1111.local</p>
  <form method="post">
    <label>Name</label><input type="text" name="name" required>
    <label>Email</label><input type="email" name="email" required>
    <label>Message</label><textarea name="message" rows="5" required></textarea>
    <button class="common-btn w-100 mt-3" type="submit">Send</button>
  </form>
</div>
{% endblock %}
