{% extends "base.html" %}
{% block title %}Create account | 11-11{% endblock %}
{% block content %}
<style>
  .auth-wrap{min-height:60vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
  .auth-card{width:min(420px,100%);background:#fff;border:1px solid #eadfce;border-radius:20px;padding:28px}
  .auth-card .brand{display:flex;flex-direction:column;align-items:center;margin-bottom:18px;text-decoration:none;color:#420e15}
  .auth-card .mark{font:700 36px/1 Georgia,serif}
  .auth-card .mark span{color:#be923b}
  .auth-card .sub{margin-top:6px;font:600 10px system-ui,sans-serif;letter-spacing:2px;color:#be923b}
  .auth-card h2{text-align:center;margin:0 0 16px}
  .auth-card label{display:block;margin:12px 0 4px;font:600 13px system-ui,sans-serif}
  .auth-card input{width:100%;padding:12px;border:1px solid #eadfce;border-radius:12px;font-size:16px}
  .auth-card button{width:100%;margin-top:14px;background:#420e15;color:#fff;border:0;border-radius:12px;padding:12px;font:700 15px system-ui,sans-serif}
  .auth-card p{text-align:center}
</style>
<section class="auth-wrap">
  <div class="auth-card">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="mark">11<span>:</span>11</span>
      <span class="sub">eleven-eleven</span>
    </a>
    <h2>Create account</h2>
    <form method="post">
      <label>Full name</label><input type="text" name="name" required>
      <label>Email</label><input type="email" name="email" required>
      <label>Phone</label><input type="tel" name="phone">
      <label>Password</label><input type="password" name="password" required minlength="6">
      <button type="submit">Create account</button>
    </form>
    <p><a href="{{ url_for('login') }}">Sign in</a></p>
  </div>
</section>
{% endblock %}
