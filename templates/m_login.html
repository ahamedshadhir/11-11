{% extends "m_base.html" %}
{% block title %}Login | 11-11{% endblock %}
{% block content %}
<section class="pad">
  <h1>{{ t('login') }}</h1>
  <a class="btn" href="/auth/google" style="margin:6px 0">Google</a>
  <a class="btn" href="/auth/apple" style="margin:6px 0">Apple</a>
  <form class="stack" method="post" action="{{ url_for('login') }}">
    <label>Email</label><input type="email" name="email" required>
    <label>Password</label><input type="password" name="password" required>
    <p><button class="common-btn" type="submit">{{ t('login') }}</button></p>
  </form>
  <p><a href="/register">Create account</a></p>
</section>
{% endblock %}
